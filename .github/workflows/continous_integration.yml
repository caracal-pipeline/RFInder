# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Ubuntu CI

on:
  push:
    branches:
      - "**"   # Triggers on push to any branch, including new ones
    tags:
      - "*"    # Triggers on push to any tag
  pull_request:
  schedule:
    - cron: '30 2 * * 1'  # Every Monday at 2:30 AM UTC

env:
  POETRY_VERSION: 2.0.1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04 ]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Test poetry
        run: poetry --version

      - name: Checkout source
        uses: actions/checkout@v2
        with:
          fetch-depth: 1

      - name: Install rfinder
        run: poetry install --extras "testing"

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          poetry run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
#      - name: Test with pytest
#        run: poetry run pytest -s -vvv


      - name: Download test dataset
        run: curl https://ratt-public-data.s3.af-south-1.amazonaws.com/test-data/HLTau_B6cont.calavg.tav300s.tar.xz | tar xJf -

      - name: Test rfinder command
        run: |
          poetry run rfinder --help

      - name: Run end to end test
        run: |
          poetry run rfinder -i HLTau_B6cont.calavg.tav300s -fl 0 -tel meerkat -l test 
          poetry run rfinder -i HLTau_B6cont.calavg.tav300s -fl 0 -tel meerkat -l test -rfi
