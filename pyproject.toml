[project]
name = "rfinder"
version = "1.2.0"
description = "Tool for identify the presence of RFI in an observation, flagging and visualisation"
authors = [
    { name = "Filippo Marcello Maccagni", email = "filippo.maccagni@gmail.com" }
]
readme = "README.md"
license = { text = "GNU GPL v3" }
requires-python = ">=3.9,<3.14"
keywords = ["Astronomy", "Visualisation", "RFI"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux"
]
dependencies = [
    "astropy>=5.2.1",
    "imageio>=2.27.0",
    "ipython>=8.12.0",
    "jinja2>=3.1.2",
    "matplotlib>=3.7.1",
    "numpy>=1.24.2",
    "pyyaml>=6.0",
    "python-casacore>=3.5.2",
    "scabha>=2.2.0rc0"
]

[project.urls]
Homepage = "https://github.com/caracal-pipeline/rfinder"
Repository = "https://github.com/caracal-pipeline/rfinder"

[project.scripts]
rfinder = "rfinder.main:driver"

[dependency-groups]
tests = ["pytest>=7.1.3", "ruff"]
docs = ["Sphinx>=5.3.0", "sphinx-copybutton>=0.5.0", "furo>=2022.9.15"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]
ignore = [
    "E501", # Line length
    # Pre-existing code style, deliberately not touched in the lint cleanup pass -
    # that pass fixed everything ruff could auto-fix safely.
    # Revisit/tighten
    "E711", # none-comparison (`== None` instead of `is None`)
    "E712", # true-false-comparison (`== True`/`== False` instead of `is`)
    "E402", # module-import-not-at-top-of-file
    "F841", # unused-variable (removal could have side effects, needs review per case)
    "N801", "N802", "N803", "N806", "N812", "N816", # naming-convention (renames need care - could be part of a public/import-time API)
]

[tool.uv]
default-groups = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
